# Publishes @doc-cheap/mcp to npm.
#
# This repository is the generated public mirror of one package; the server is
# developed elsewhere and every file here, this one included, is written by the
# sync script — edit it there, not here. The canonical copy sits beside the
# server's sources, because a file the sync did not know about was a file the
# next sync deleted. The pipeline runs here rather than beside those sources
# because npm's trusted publishing accepts an OIDC token only from GitLab.com's
# own instance runners and only from a public project, and the development
# repository is private and builds on a self-hosted runner.
#
# No credential is stored anywhere: GitLab mints the two ID tokens below, npm
# exchanges the first for a publish credential that lives for the length of the
# call, and signs a provenance attestation with the second.
#
# The same tag also builds the MCP Bundle (`.mcpb`, the one-click install for
# Claude Desktop), puts it in this project's package registry with the job's
# own token, and creates the release that links it.

default:
  image: node:24-alpine

stages:
  - verify
  - publish
  - release

# The steps a release runs, minus the publish itself. Cutting a tag against a
# tree that cannot be built is the failure worth catching before the version
# number is spent: a published version is immutable, so a bad one is not undone.
verify:
  stage: verify
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PROJECT_PATH == "doccheap/ocr-mcp"
  script:
    - node --version
    # No lockfile is committed: the tree is regenerated in full by the sync
    # script, which would delete one. `npm ci` therefore has nothing to read.
    - npm install
    - npm run typecheck
    - npm run build
    - npm publish --dry-run --access public
    # The bundle is validated and packed by the official MCPB CLI on every
    # push, so a manifest the CLI refuses stops here, before a tag.
    - node pack-mcpb.mjs
  artifacts:
    paths:
      - dist-mcpb/*.mcpb
      - dist-mcpb/*.sha256
    expire_in: 1 week

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_PROJECT_PATH == "doccheap/ocr-mcp"
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  # A publish that is cancelled mid-call can still have reached the registry.
  interruptible: false
  resource_group: npm-publish
  before_script:
    # Trusted publishing needs npm >= 11.5.1; the image is upgraded only when
    # its own npm is older, so an ordinary release pays for no download.
    - |
      node -e 'const v=require("child_process").execSync("npm --version").toString().trim().split(".").map(Number);
               process.exit((v[0]>11||(v[0]===11&&(v[1]>5||(v[1]===5&&v[2]>=1))))?0:1)' \
        || npm install --global npm@latest
    - node --version
    - npm --version
  script:
    # The tag is what a human types; package.json is what npm publishes. They
    # are compared here so a mistyped tag fails before the version is spent.
    - |
      version="$(node -p "require('./package.json').version")"
      if [ "v$version" != "$CI_COMMIT_TAG" ]; then
        echo "tag $CI_COMMIT_TAG does not match package.json $version" >&2
        exit 1
      fi
    - npm install
    - npm run build
    # No --provenance flag: under trusted publishing npm attests automatically,
    # and only for a public package out of a public repository, which this is.
    - npm publish --access public

# The MCP Bundle for the tag. It runs after the npm publish because a bundle
# of a version npm refused would describe a package nobody can install.
bundle:
  stage: publish
  needs: [publish]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_PROJECT_PATH == "doccheap/ocr-mcp"
  interruptible: false
  script:
    - npm install
    - npm run build
    - node pack-mcpb.mjs
    - node upload-mcpb.mjs
  artifacts:
    paths:
      - dist-mcpb/*.mcpb
      - dist-mcpb/*.sha256
    reports:
      dotenv: bundle.env

# The release for the tag, linking the bundle under the release's own stable
# address: `/-/releases/<tag>/downloads/<file>` redirects to the package file,
# and it is the form the MCP registry accepts for a GitLab-hosted bundle.
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: bundle
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $CI_PROJECT_PATH == "doccheap/ocr-mcp"
  script:
    - echo "release $CI_COMMIT_TAG with $MCPB_FILE (sha256 $MCPB_SHA256)"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "@doc-cheap/mcp $CI_COMMIT_TAG on npm, and the Claude Desktop extension $MCPB_FILE (SHA-256 $MCPB_SHA256)."
    assets:
      links:
        - name: $MCPB_FILE
          url: $MCPB_PACKAGE_URL
          filepath: /$MCPB_FILE
          link_type: package
